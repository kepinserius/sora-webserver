[package]
name = "webserver"
version = "0.1.0"
edition = "2021"
authors = ["User"]
description = "A secure web server with features similar to Apache/Nginx"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
http = "0.2"
tower = "0.4"
tower-http = { version = "0.3", features = ["trace", "compression-gzip", "cors", "fs", "auth"] }
tokio-rustls = "0.23"
rustls = "0.20"
rustls-pemfile = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
once_cell = "1.8"
futures = "0.3"
async-stream = "0.3"
regex = "1.7"
mime_guess = "2.0"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
httpdate = "1.0"
cidr = "0.2"
rand = "0.8"
hyper-rustls = { version = "0.23", features = ["http2"] }
chrono = "0.4"
base64 = "0.13"
ring = "0.16"
num_cpus = "1.13"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true 